# Publishes web/ plus the latest data/results.json (from the `data` branch) to GitHub Pages.
# Triggered by poll.yml after every poll, and by pushes that change the frontend.
name: deploy
on:
  workflow_dispatch:
  push:
    branches-ignore: [data]
    paths: ["web/**", ".github/workflows/deploy.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p dist/data
          cp -r web/. dist/
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:data/results.json > dist/data/results.json
          else
            echo "No data branch yet; site will show 'no data published yet'."
          fi
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
